<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5c">
  <title>SGML · Operario</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg">
  <style>
    :root { --verde:#1f6f5c; --gris:#5b6470; --fondo:#f4f6f5; --rojo:#b3261e; --ambar:#a66300; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Roboto, sans-serif; background:var(--fondo); color:#1c2321; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px;
      background:var(--verde); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:1; }
    header h1 { margin:0; font-size:18px; }
    #red { font-size:13px; margin-top:4px; }
    #cerrar-sesion { width:auto; min-height:38px; margin:0; padding:6px 12px;
      border:1px solid #ffffff99; background:transparent; font-size:14px; line-height:normal; }
    #cerrar-sesion:hover { background:#ffffff20; }
    main { padding:12px; max-width:560px; margin:auto; }
    .tarjeta { background:#fff; border-radius:10px; padding:12px; margin-bottom:12px; box-shadow:0 1px 2px #0002; }
    .tarjeta.actividad { border:1px solid #dfe5e2; border-left:5px solid #9aa5a0; }
    .tarjeta.actividad.estado-en-curso { border-color:#d6a542; background:#fffaf0; }
    .tarjeta.actividad.estado-finalizada-local { border-color:#d6a542; background:#fffaf0; }
    .tarjeta.actividad.estado-finalizada, .tarjeta.actividad.estado-aceptada {
      border-color:#31805b; background:#eef8f1; }
    .tarjeta.actividad.estado-rechazada { border-color:#bb3d36; background:#fff2f1; }
    .tarjeta h2 { font-size:16px; margin:0 0 4px; }
    .sub { color:var(--gris); font-size:13px; margin:0 0 10px; }
    .actividad-cabecera { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px; }
    .estado-actividad { display:inline-block; padding:4px 9px; border-radius:999px;
      background:#e8ecea; color:#46504c; font-size:11px; font-weight:750; }
    .estado-actividad.en-curso { background:#fff0c2; color:#744b00; }
    .estado-actividad.finalizada-local { background:#fff0c2; color:#744b00; }
    .estado-actividad.finalizada, .estado-actividad.aceptada { background:#d5efdf; color:#155b38; }
    .estado-actividad.rechazada { background:#f9d9d6; color:#9d241e; }
    .resultado-actividad { margin:10px 0 0; color:#155b38; font-size:13px; font-weight:650; }
    .resultado-actividad.pendiente { color:#744b00; }
    button, .boton { display:block; width:100%; min-height:48px; margin:6px 0; border:0; border-radius:8px;
      font-size:16px; font-weight:600; background:var(--verde); color:#fff; cursor:pointer; text-align:center; line-height:48px; }
    button:disabled, .boton.deshabilitado { background:#c8cfcc; color:#6b7471; pointer-events:none; }
    button.secundario { background:#fff; color:var(--verde); border:2px solid var(--verde); }
    .boton input { display:none; }
    .hecho { color:var(--verde); font-size:13px; }
    .pasos { display:flex; gap:6px; font-size:12px; margin-bottom:6px; flex-wrap:wrap; }
    .paso { padding:2px 8px; border-radius:10px; background:#e7ecea; color:var(--gris); }
    .paso.ok { background:#d5ece4; color:var(--verde); font-weight:600; }
    input[type=date], select { width:100%; min-height:44px; font-size:16px; padding:6px; border:1px solid #c8cfcc; border-radius:8px; }
    .aviso { font-size:13px; padding:8px; border-radius:6px; margin:6px 0; }
    .aviso.error { background:#fbe9e8; color:var(--rojo); }
    .aviso.info { background:#eef4f2; color:var(--verde); }
    .fila { display:flex; gap:8px; }
    .fila > * { flex:1; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>SGML · Mis trabajos</h1>
      <div id="red">…</div>
    </div>
    <button id="cerrar-sesion" type="button">Cerrar sesión</button>
  </header>
  <main>
    <section class="tarjeta" id="config">
      <h2 id="nombre-operario">Operario</h2>
      <div class="fila">
        <input type="date" id="fecha">
      </div>
      <button class="secundario" id="descargar">Actualizar mi programación (requiere red)</button>
    </section>

    <section class="tarjeta">
      <h2>Sincronización</h2>
      <p class="sub" id="cola">Pendientes: 0</p>
      <button id="sincronizar">Sincronizar ahora</button>
      <div id="mensajes"></div>
    </section>

    <section class="tarjeta" id="jornada"></section>
    <div id="actividades"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
